<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda WA Bot</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wrap { width: 100%; max-width: 880px; }

        header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        h1 { font-size: 1.45rem; font-weight: 700; }
        .muted { color: var(--text-muted); font-size: 0.875rem; }
        .live { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
        .dot.ok { background: var(--success); box-shadow: 0 0 8px rgba(16,185,129,0.8); }
        .dot.no { background: var(--danger); box-shadow: 0 0 8px rgba(239,68,68,0.8); }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 18px;
        }
        .section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        a.btn, button.btn {
            display: flex; align-items: center; gap: 9px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-size: 0.88rem;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.1s;
            text-align: left;
        }
        a.btn:hover, button.btn:hover { background: rgba(59, 130, 246, 0.15); border-color: var(--primary); transform: translateY(-1px); }
        .btn.active { background: rgba(59, 130, 246, 0.22); border-color: var(--primary); }
        .btn .emoji { font-size: 1.05rem; }
        .btn.small { padding: 10px 14px; flex: 0 0 auto; }
        .btn.danger:hover { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); }

        .token-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .token-row input {
            flex: 1; min-width: 220px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-size: 0.9rem;
        }
        .token-row input:focus { outline: none; border-color: var(--primary); }

        .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; text-transform: none; letter-spacing: 0; }
        .pill.ok { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .pill.no { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .pill.warn { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .pill.info { background: rgba(59, 130, 246, 0.15); color: var(--primary); }

        /* ── panel hasil ── */
        #output { display: none; }
        #output-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
        #output-title { font-weight: 600; font-size: 1.02rem; display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            border: 1px solid var(--card-border); background: rgba(255,255,255,0.04); color: var(--text-muted);
            border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 0.8rem;
        }
        .icon-btn:hover { color: var(--text-main); border-color: var(--primary); }

        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .tile {
            background: rgba(15, 23, 42, 0.55); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 14px;
        }
        .tile .num { font-size: 1.45rem; font-weight: 700; line-height: 1.2; }
        .tile .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        .tile.accent .num { color: var(--primary); }
        .tile.good .num { color: var(--success); }
        .tile.warn .num { color: var(--warning); }

        .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 0.88rem; }
        .kv .k { color: var(--text-muted); white-space: nowrap; }
        .kv .v { word-break: break-word; }

        .hero { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 12px; margin-bottom: 14px; border: 1px solid var(--card-border); }
        .hero.ok { background: rgba(16,185,129,0.1); }
        .hero.no { background: rgba(239,68,68,0.1); }
        .hero .big { font-size: 2rem; }
        .hero .t { font-weight: 700; font-size: 1.05rem; }

        .rows { display: flex; flex-direction: column; gap: 8px; }
        .row {
            display: flex; align-items: center; gap: 12px;
            background: rgba(15, 23, 42, 0.55); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 12px 14px; font-size: 0.88rem;
        }
        .row.click { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
        .row.click:hover { border-color: var(--primary); background: rgba(59,130,246,0.1); }
        .row .main { flex: 1; min-width: 0; }
        .row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row .sub { color: var(--text-muted); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
        .row .side { color: var(--text-muted); font-size: 0.75rem; white-space: nowrap; }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center;
            background: rgba(59,130,246,0.2); color: var(--primary); font-weight: 700; font-size: 0.9rem;
        }

        table.nice { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table.nice th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--card-border); }
        table.nice td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); word-break: break-all; }
        .table-scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; border: 1px solid var(--card-border); border-radius: 12px; }

        .search { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(15,23,42,0.6); color: var(--text-main); font-size: 0.88rem; margin-bottom: 12px; }
        .search:focus { outline: none; border-color: var(--primary); }

        .loglist { display: flex; flex-direction: column; gap: 6px; max-height: 440px; overflow-y: auto; }
        .logline { display: flex; gap: 10px; align-items: baseline; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; background: rgba(15,23,42,0.55); border-radius: 8px; padding: 8px 12px; }
        .logline .time { color: var(--text-muted); white-space: nowrap; }
        .logline .msg { word-break: break-word; }
        .logline.err .msg { color: var(--danger); }
        .logline.warn .msg { color: var(--warning); }

        .bubblewrap { display: flex; flex-direction: column; gap: 8px; max-height: 460px; overflow-y: auto; padding: 4px; }
        .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 0.88rem; white-space: pre-wrap; word-break: break-word; }
        .bubble .btime { display: block; font-size: 0.68rem; color: var(--text-muted); margin-top: 4px; }
        .bubble.in { align-self: flex-start; background: rgba(30,41,59,0.95); border: 1px solid var(--card-border); border-bottom-left-radius: 4px; }
        .bubble.out { align-self: flex-end; background: rgba(59,130,246,0.25); border: 1px solid rgba(59,130,246,0.4); border-bottom-right-radius: 4px; }

        .greetbubble {
            background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
            border-radius: 14px; border-bottom-left-radius: 4px;
            padding: 16px; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.55;
        }

        .empty { text-align: center; padding: 36px 16px; color: var(--text-muted); }
        .empty .big { font-size: 2.2rem; margin-bottom: 8px; }

        .qrbox { text-align: center; }
        .qrbox img { border-radius: 12px; background: #fff; padding: 10px; margin-top: 12px; max-width: 100%; }

        .spinner {
            width: 28px; height: 28px; margin: 24px auto; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div>
                <h1>Beranda WA Bot</h1>
                <p class="muted">Semua halaman dan data bot dalam satu tempat.</p>
            </div>
            <div class="live"><span class="dot" id="live-dot"></span><span id="live-text">memeriksa…</span></div>
        </header>

        <div class="glass" id="token-card">
            <div class="section-title">Token Admin <span id="token-status" class="pill no">belum tersimpan</span></div>
            <p class="muted">Token disimpan di browser ini saja (sama dengan login dashboard). Isi sekali, selanjutnya otomatis.</p>
            <div class="token-row">
                <input type="password" id="token-input" placeholder="Tempel API Token di sini" onkeydown="if(event.key==='Enter')simpanToken()">
                <button class="btn small" onclick="simpanToken()">💾 Simpan</button>
                <button class="btn small danger" onclick="hapusToken()">🗑️ Hapus</button>
            </div>
        </div>

        <div class="glass">
            <div class="section-title">Halaman</div>
            <div class="grid">
                <a class="btn" href="/"><span class="emoji">🖥️</span> Dashboard Admin</a>
                <a class="btn" href="/laporan"><span class="emoji">📄</span> Laporan Publik</a>
                <a class="btn" href="#" onclick="return bukaLaporanPenuh()"><span class="emoji">🔐</span> Laporan Lengkap</a>
            </div>
        </div>

        <div class="glass">
            <div class="section-title">Data Bot <span class="pill info">butuh token</span></div>
            <div class="grid" id="json-buttons"></div>
        </div>

        <div class="glass" id="output">
            <div id="output-head">
                <div id="output-title">Hasil</div>
                <button class="icon-btn" onclick="tutupOutput()">✕ Tutup</button>
            </div>
            <div id="output-body"></div>
        </div>
    </div>

    <script>
        // Kunci localStorage SENGAJA sama dengan dashboard: login di salah satu
        // halaman berlaku untuk keduanya.
        const TOKEN_KEY = 'bot_api_token';
        const $ = (id) => document.getElementById(id);
        // Semua teks dari WhatsApp (nama, isi pesan) lewat sini — tanpa ini, satu
        // pesan berisi <script> dari pelanggan bisa menyuntik kode ke halaman admin.
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        const STAT_LABELS = {
            masuk: ['Pesan masuk', 'accent'], keluar: ['Pesan keluar', 'accent'],
            sapaan: ['Sapaan terkirim', 'good'], didiamkan: ['Didiamkan', ''],
            sesi_bot: ['Sesi bot', ''], webhook_ok: ['Webhook sukses', 'good'],
            balas_manual: ['Balasan manual', ''], panggil_min: ['Panggil admin', 'warn'],
            perintah_polos: ['Perintah polos', ''], polos_cari: ['Cari tanpa titik', ''],
        };

        const ENDPOINTS = [
            { path: '/status',      emoji: '📊', label: 'Status Bot',   render: renderStatus },
            { path: '/qr',          emoji: '🔳', label: 'QR Login',     render: renderQR },
            { path: '/stats',       emoji: '📈', label: 'Statistik',    render: renderStats },
            { path: '/logs',        emoji: '📜', label: 'Log Bot',      render: renderLogs },
            { path: '/settings',    emoji: '💬', label: 'Sapaan Bot',   render: renderSettings },
            { path: '/chats',       emoji: '📥', label: 'Daftar Chat',  render: renderChats },
            { path: '/profile',     emoji: '👤', label: 'Profil Bot',   render: renderProfile },
            { path: '/groups',      emoji: '👥', label: 'Grup',         render: (d) => renderSimpleList(d.groups, '👥', 'Belum ada grup yang tercatat.', g => [g.subject || g.name || g.id, g.id]) },
            { path: '/newsletters', emoji: '📰', label: 'Saluran',      render: (d) => renderSimpleList(d.newsletters, '📰', 'Bot belum mengikuti saluran apa pun.', n => [n.name || n.id, n.id]) },
            { path: '/blocklist',   emoji: '🚫', label: 'Blokir',       render: (d) => renderSimpleList(d.blocklist, '🚫', 'Tidak ada nomor yang diblokir. Bersih!', j => [nomorDari(j), j]) },
            { path: '/lid-map',     emoji: '🗺️', label: 'Peta LID',     render: renderLidMap },
            { path: '/story',       emoji: '📖', label: 'Story',        render: (d) => renderSimpleList(d.statuses, '📖', 'Belum ada story yang dipasang.', s => [s.text || '[media]', waktuSingkat(s.time)]) },
        ];

        /* ── util ───────────────────────────────────────────────────────── */
        function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
        function nomorDari(jid) { return String(jid || '').split('@')[0]; }
        function inisial(nama) {
            const n = String(nama || '').trim();
            if (!n) return '👤';
            const digit = /^\d+$/.test(n[0]);
            return digit ? '#' : n[0].toUpperCase();
        }
        function formatUptime(sec) {
            if (!sec) return '0 detik';
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
            if (h) return h + ' jam ' + m + ' menit';
            if (m) return m + ' menit';
            return Math.floor(sec) + ' detik';
        }
        function waktuSingkat(ts) {
            if (!ts) return '-';
            const d = new Date(ts);
            if (isNaN(d)) return '-';
            const kini = new Date();
            const sameDay = d.toDateString() === kini.toDateString();
            return sameDay
                ? d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }
        function relatif(ts) {
            if (!ts) return '';
            const detik = Math.floor((Date.now() - ts) / 1000);
            if (detik < 60) return 'baru saja';
            if (detik < 3600) return Math.floor(detik / 60) + ' mnt lalu';
            if (detik < 86400) return Math.floor(detik / 3600) + ' jam lalu';
            return waktuSingkat(ts);
        }
        function emptyState(emoji, msg) {
            return '<div class="empty"><div class="big">' + emoji + '</div><p>' + esc(msg) + '</p></div>';
        }
        function tiles(obj, labels) {
            let html = '<div class="tiles">';
            for (const [k, v] of Object.entries(obj || {})) {
                const [lbl, cls] = labels[k] || [k.replace(/_/g, ' '), ''];
                html += '<div class="tile ' + cls + '"><div class="num">' + esc(v) + '</div><div class="lbl">' + esc(lbl) + '</div></div>';
            }
            return html + '</div>';
        }

        /* ── token ──────────────────────────────────────────────────────── */
        function refreshTokenStatus() {
            const s = $('token-status');
            if (getToken()) { s.textContent = 'tersimpan ✓'; s.className = 'pill ok'; }
            else { s.textContent = 'belum tersimpan'; s.className = 'pill no'; }
        }
        function simpanToken() {
            const v = $('token-input').value.trim();
            if (!v) return alert('Tempel dulu tokennya!');
            localStorage.setItem(TOKEN_KEY, v);
            $('token-input').value = '';
            refreshTokenStatus();
        }
        function hapusToken() { localStorage.removeItem(TOKEN_KEY); refreshTokenStatus(); }
        function butuhToken() {
            alert('Token belum tersimpan. Tempel token di kolom atas dulu (sekali saja).');
            $('token-input').focus();
        }
        function bukaLaporanPenuh() {
            const t = getToken();
            if (!t) { butuhToken(); return false; }
            window.open('/laporan/penuh?token=' + encodeURIComponent(t), '_blank', 'noopener');
            return false;
        }

        /* ── panel hasil ────────────────────────────────────────────────── */
        function tampilkan(judul, html) {
            $('output-title').innerHTML = judul;
            $('output-body').innerHTML = html;
            $('output').style.display = 'block';
            $('output').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        function tutupOutput() {
            $('output').style.display = 'none';
            document.querySelectorAll('#json-buttons .btn').forEach(b => b.classList.remove('active'));
        }

        async function ambil(path) {
            const res = await fetch(path, { headers: { 'Authorization': getToken() } });
            if (res.status === 401) throw new Error('Token salah atau kedaluwarsa — periksa lagi di kolom atas.');
            if (res.status === 429) throw new Error('Terlalu banyak percobaan token. Tunggu beberapa menit.');
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error === 'Bot not connected' ? 'Bot sedang tidak tersambung ke WhatsApp.' : (data.error || 'HTTP ' + res.status));
            return data;
        }

        async function buka(ep, btn) {
            if (!getToken()) return butuhToken();
            document.querySelectorAll('#json-buttons .btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            tampilkan(ep.emoji + ' ' + esc(ep.label), '<div class="spinner"></div>');
            try {
                const data = await ambil(ep.path);
                $('output-body').innerHTML = ep.render(data);
            } catch (err) {
                $('output-body').innerHTML = emptyState('⚠️', err.message);
            }
        }

        /* ── render per endpoint ────────────────────────────────────────── */
        function renderStatus(d) {
            const ok = !!d.connected;
            let html = '<div class="hero ' + (ok ? 'ok' : 'no') + '">'
                + '<div class="big">' + (ok ? '✅' : '🔴') + '</div><div>'
                + '<div class="t">' + (ok ? 'Bot tersambung ke WhatsApp' : 'Bot tidak tersambung') + '</div>'
                + '<div class="muted">' + (ok
                    ? 'Nomor ' + esc(d.phone || '-') + (d.connectedAt ? ' · sejak ' + waktuSingkat(d.connectedAt) : '')
                    : (d.hasQR ? 'QR login tersedia — klik tombol "QR Login" lalu scan dari HP.' : 'Sedang mencoba menyambung ulang…'))
                + '</div></div></div>';
            html += '<div class="kv">'
                + '<span class="k">Server hidup</span><span class="v">' + formatUptime(d.uptime) + '</span>'
                + '<span class="k">Antrean pesan</span><span class="v">' + esc(d.queueLength ?? 0) + ' pesan</span>'
                + '<span class="k">Percobaan sambung ulang</span><span class="v">' + esc(d.reconnectAttempts ?? 0) + ' kali</span>'
                + (d.offlineSince && !ok ? '<span class="k">Terputus sejak</span><span class="v">' + waktuSingkat(d.offlineSince) + '</span>' : '')
                + '<span class="k">Webhook</span><span class="v">' + esc(d.webhookUrl || '-') + '</span>'
                + '</div>';
            if (d.today && Object.keys(d.today).length) {
                html += '<div class="section-title" style="margin-top:18px">Aktivitas hari ini</div>' + tiles(d.today, STAT_LABELS);
            }
            return html;
        }

        function renderQR(d) {
            if (d.qr && String(d.qr).startsWith('data:image')) {
                return '<div class="qrbox"><p class="muted">Buka WhatsApp di HP → <b>Perangkat tertaut</b> → <b>Tautkan perangkat</b>, lalu scan:</p>'
                    + '<img src="' + d.qr + '" alt="QR WhatsApp" width="300" height="300">'
                    + '<p class="muted" style="margin-top:10px">QR berganti berkala — kalau kedaluwarsa, klik tombol QR Login lagi.</p></div>';
            }
            return emptyState('✅', 'Tidak ada QR — bot sudah tersambung ke WhatsApp.');
        }

        function renderStats(d) {
            let html = '<div class="section-title">Hari ini</div>' + tiles(d.today, STAT_LABELS);
            html += '<div class="section-title" style="margin-top:18px">Total sejak ' + esc(d.since || '-') + '</div>' + tiles(d.total, STAT_LABELS);
            if (d.archive) html += '<p class="muted" style="margin-top:14px">Arsip pesan: ' + esc(d.archive.messages) + ' dari maksimal ' + esc(d.archive.cap) + '.</p>';
            return html;
        }

        function renderLogs(d) {
            const logs = (d.logs || []).slice().reverse();
            if (!logs.length) return emptyState('📜', 'Belum ada log.');
            let html = '<p class="muted" style="margin-bottom:10px">Terbaru di atas · ' + logs.length + ' baris</p><div class="loglist">';
            for (const line of logs) {
                const m = String(line).match(/^\[([^\]]+)\]\s*\[([A-Z]+)\]\s*(.*)$/s);
                const time = m ? waktuSingkat(m[1]) : '';
                const level = m ? m[2] : '';
                const msg = m ? m[3] : String(line);
                const cls = level === 'ERROR' ? 'err' : (level === 'WARN' ? 'warn' : '');
                html += '<div class="logline ' + cls + '"><span class="time">' + esc(time) + '</span><span class="msg">' + esc(msg) + '</span></div>';
            }
            return html + '</div>';
        }

        function renderSettings(d) {
            const badge = d.isCustom
                ? '<span class="pill info">sapaan kustom</span>'
                : '<span class="pill ok">sapaan bawaan</span>';
            return '<div class="section-title">Pesan sapaan yang diterima pelanggan baru ' + badge + '</div>'
                + '<div class="greetbubble">' + esc(d.greeting || '(kosong)') + '</div>'
                + '<p class="muted" style="margin-top:12px">Mau mengubah sapaan? Lakukan lewat Dashboard Admin.</p>';
        }

        function renderChats(d) {
            const chats = d.chats || [];
            if (!chats.length) return emptyState('📥', 'Belum ada chat yang tercatat.');
            let html = '<input class="search" placeholder="🔍 Cari nama atau nomor…" oninput="filterRows(this)">'
                + '<p class="muted" style="margin-bottom:10px">' + chats.length + ' chat · klik untuk lihat isi pesan</p><div class="rows">';
            for (const c of chats) {
                const nama = c.name || nomorDari(c.jid);
                html += '<div class="row click" data-jid="' + esc(c.jid) + '" data-nama="' + esc(nama) + '" data-cari="' + esc((nama + ' ' + c.jid).toLowerCase()) + '" onclick="bukaPesan(this)">'
                    + '<div class="avatar">' + esc(inisial(c.name)) + '</div>'
                    + '<div class="main"><div class="name">' + esc(nama) + '</div>'
                    + '<div class="sub">' + esc(c.preview || nomorDari(c.jid)) + '</div></div>'
                    + '<div class="side">' + relatif(c.lastTime) + '</div></div>';
            }
            return html + '</div>';
        }

        function filterRows(input) {
            const q = input.value.trim().toLowerCase();
            input.parentElement.querySelectorAll('.row[data-cari]').forEach(r => {
                r.style.display = !q || r.dataset.cari.includes(q) ? '' : 'none';
            });
        }

        async function bukaPesan(rowEl) {
            const jid = rowEl.dataset.jid, nama = rowEl.dataset.nama;
            tampilkan('💬 ' + esc(nama), '<div class="spinner"></div>');
            try {
                const d = await ambil('/messages?jid=' + encodeURIComponent(jid));
                const msgs = d.messages || [];
                if (!msgs.length) { $('output-body').innerHTML = emptyState('💬', 'Arsip pesan untuk chat ini kosong.'); return; }
                let html = '<button class="icon-btn" style="margin-bottom:12px" onclick="kembaliKeChat()">← Kembali ke daftar chat</button>'
                    + '<div class="bubblewrap" id="bubbles">';
                for (const m of msgs) {
                    html += '<div class="bubble ' + (m.fromMe ? 'out' : 'in') + '">' + esc(m.text || '[' + (m.type || 'media') + ']')
                        + '<span class="btime">' + waktuSingkat(m.time) + '</span></div>';
                }
                $('output-body').innerHTML = html + '</div>';
                const bw = $('bubbles');
                bw.scrollTop = bw.scrollHeight;
            } catch (err) {
                $('output-body').innerHTML = emptyState('⚠️', err.message);
            }
        }
        function kembaliKeChat() {
            const ep = ENDPOINTS.find(e => e.path === '/chats');
            buka(ep, document.querySelector('#json-buttons .btn.active'));
        }

        function renderProfile(d) {
            if (!d.name && !d.phone && !d.jid) return emptyState('👤', 'Profil belum terisi — biasanya muncul setelah bot tersambung.');
            return '<div class="hero ok"><div class="big">👤</div><div>'
                + '<div class="t">' + esc(d.name || '(tanpa nama)') + '</div>'
                + '<div class="muted">' + esc(d.phone || nomorDari(d.jid) || '-') + '</div>'
                + '</div></div>';
        }

        function renderLidMap(d) {
            const entries = d.entries || [];
            if (!entries.length) return emptyState('🗺️', 'Peta LID masih kosong.');
            let html = '<input class="search" placeholder="🔍 Cari nomor…" oninput="filterLid(this)">'
                + '<p class="muted" style="margin-bottom:10px">' + entries.length + ' pemetaan LID → nomor asli</p>'
                + '<div class="table-scroll"><table class="nice"><thead><tr><th>LID (samaran)</th><th>Nomor asli</th></tr></thead><tbody id="lid-body">';
            for (const e of entries) {
                html += '<tr data-cari="' + esc((e.lid + ' ' + e.phone).toLowerCase()) + '"><td>' + esc(nomorDari(e.lid)) + '</td><td>' + esc(nomorDari(e.phone)) + '</td></tr>';
            }
            return html + '</tbody></table></div>';
        }
        function filterLid(input) {
            const q = input.value.trim().toLowerCase();
            document.querySelectorAll('#lid-body tr').forEach(r => {
                r.style.display = !q || r.dataset.cari.includes(q) ? '' : 'none';
            });
        }

        function renderSimpleList(arr, emoji, pesanKosong, mapFn) {
            const items = arr || [];
            if (!items.length) return emptyState(emoji, pesanKosong);
            let html = '<div class="rows">';
            for (const it of items) {
                const [judul, sub] = mapFn(it);
                html += '<div class="row"><div class="avatar">' + emoji + '</div><div class="main">'
                    + '<div class="name">' + esc(judul) + '</div>'
                    + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div></div>';
            }
            return html + '</div>';
        }

        /* ── indikator hidup (tanpa token, pakai /health publik) ────────── */
        async function cekHidup() {
            const dot = $('live-dot'), txt = $('live-text');
            try {
                const res = await fetch('/health');
                const d = await res.json();
                if (d.ok) { dot.className = 'dot ok'; txt.textContent = 'Bot tersambung'; }
                else { dot.className = 'dot no'; txt.textContent = 'Bot terputus'; }
            } catch (e) { dot.className = 'dot no'; txt.textContent = 'Server tidak merespons'; }
        }

        /* ── init ───────────────────────────────────────────────────────── */
        const grid = $('json-buttons');
        for (const ep of ENDPOINTS) {
            const b = document.createElement('button');
            b.className = 'btn';
            const em = document.createElement('span');
            em.className = 'emoji'; em.textContent = ep.emoji;
            b.appendChild(em);
            b.appendChild(document.createTextNode(ep.label));
            b.onclick = () => buka(ep, b);
            grid.appendChild(b);
        }
        refreshTokenStatus();
        cekHidup();
        setInterval(cekHidup, 10000);
    </script>
</body>
</html>
